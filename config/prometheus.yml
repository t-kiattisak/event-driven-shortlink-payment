global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'payment-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['payment-service:8081']

  - job_name: 'shortlink-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['shortlink-service:8082']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
