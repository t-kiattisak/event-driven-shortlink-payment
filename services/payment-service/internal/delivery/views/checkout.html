<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayLink Checkout - {{.PaymentNo}}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .checkout-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge-PENDING { background-color: #f59e0b; color: #1e293b; }
        .badge-PAID { background-color: #10b981; color: #ffffff; }
        .badge-EXPIRED { background-color: #ef4444; color: #ffffff; }
        
        .amount {
            font-size: 2.2rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        .payment-no {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .qr-container {
            background-color: #ffffff;
            padding: 16px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 24px;
        }
        .qr-container img {
            width: 220px;
            height: 220px;
            display: block;
        }
        .instructions {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .footer {
            margin-top: 24px;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="checkout-card">
        <span class="badge badge-{{.Status}}">{{.Status}}</span>
        <div class="amount">{{.Amount}} {{.Currency}}</div>
        <div class="payment-no">Invoice: {{.PaymentNo}}</div>

        <div class="qr-container">
            <img src="{{.QRCodeData}}" alt="Payment QR Code">
        </div>

        <div class="instructions">
            Scan this QR Code with your mobile banking app to complete the payment.
        </div>

        <div class="footer">
            Created at: {{.CreatedAt}}<br>
            Powered by PayLink Event-Driven Microservices
        </div>
    </div>
</body>
</html>
